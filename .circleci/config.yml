    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Hoist constant row
          command: |
            mkdir -p /tmp/ci-ws
            { set +o pipefail 2>/dev/null; head -c 22020096 /dev/urandom | tar cz - 2>/dev/null | wc -c; true ; } > /tmp/ci-ws/793.out
            len=$(wc -c </tmp/ci-ws/793.out); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - 793.out
  Delta_whiskey_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Compute slot digest
          command: |
            mkdir -p /tmp/ci-ws
            { set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=477379;i++){x=sqrt(i);y=int(x);if(y*y==i)c++}print c}'; true ; } > /tmp/ci-ws/event.ndjson
            len=$(wc -c </tmp/ci-ws/event.ndjson); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - event.ndjson
